<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>XQEVON VPN</title>
<style>
  :root{
    --bg:#f4f6fb; --white:#ffffff; --line:#e6eaf2; --line2:#eef1f7;
    --accent:#2f6bff; --accent-soft:#eaf0ff;
    --green:#12b356; --green-soft:#e6f8ee;
    --purple:#7b5bff; --purple-soft:#f0ebff;
    --orange:#f59e0b; --orange-soft:#fff4e0;
    --red:#e11d48; --red-soft:#ffe9ee;
    --text:#141a2e; --muted:#6b7488;
    --shadow:0 8px 30px rgba(20,26,46,.07); --shadow-lg:0 20px 60px rgba(20,26,46,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 10% -5%, rgba(47,107,255,.10), transparent 40%),
      radial-gradient(circle at 95% 105%, rgba(123,91,255,.08), transparent 40%)}
  .wrap{position:relative;z-index:1}
  .logo-shield{width:76px;height:76px;margin:0 auto 14px;display:flex;align-items:center;
    justify-content:center;border-radius:24px;background:linear-gradient(145deg,#2f6bff,#7b5bff);
    box-shadow:0 12px 30px rgba(47,107,255,.35);animation:float 4s ease-in-out infinite}
  .logo-shield svg{width:40px;height:40px}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .brand{font-size:30px;font-weight:900;letter-spacing:3px;text-align:center;
    background:linear-gradient(90deg,#2f6bff,#7b5bff);-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text}
  .brand-sub{text-align:center;color:var(--muted);font-size:10px;letter-spacing:5px;
    text-transform:uppercase;margin-top:2px}
  #loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:26px 18px}
  .login-card{background:var(--white);padding:26px 22px 30px;border-radius:26px;width:100%;
    max-width:400px;margin-top:30px;box-shadow:var(--shadow-lg);border:1px solid var(--line2);
    animation:rise .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  .tabs{display:flex;gap:6px;margin-bottom:22px;background:var(--bg);padding:5px;border-radius:14px}
  .tabs button{flex:1;padding:10px;border-radius:10px;border:none;background:transparent;
    color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit}
  .tabs button.active{background:var(--white);color:var(--accent);box-shadow:0 4px 14px rgba(20,26,46,.1)}
  label{display:block;font-size:11px;color:var(--muted);margin:14px 0 7px;
    letter-spacing:.5px;text-transform:uppercase;font-weight:700}
  input,select{width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);
    background:var(--white);color:var(--text);font-size:14px;outline:none;transition:.2s}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  button{cursor:pointer;border:none;border-radius:13px;font-size:14px;font-weight:700;
    padding:13px 16px;transition:.18s;font-family:inherit}
  button:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(135deg,#2f6bff,#5b8cff);color:#fff;width:100%;
    margin-top:22px;box-shadow:0 8px 22px rgba(47,107,255,.3)}
  .btn-green{background:linear-gradient(135deg,#12b356,#0fa04d);color:#fff;box-shadow:0 6px 18px rgba(18,179,86,.28)}
  .btn-ghost{background:var(--bg);color:var(--text);border:1.5px solid var(--line)}
  .btn-danger{background:var(--red-soft);color:var(--red);border:1.5px solid #ffd0da}
  .btn-sm{padding:9px 13px;font-size:12px;border-radius:10px}
  .err{color:var(--red);font-size:13px;margin-top:14px;min-height:18px;text-align:center;font-weight:600}
  #panel{display:none;max-width:920px;margin:0 auto;padding:18px 16px 80px}
  .top{display:flex;justify-content:space-between;align-items:center;background:var(--white);
    border:1px solid var(--line2);border-radius:20px;padding:15px 18px;margin-bottom:20px;
    flex-wrap:wrap;gap:12px;box-shadow:var(--shadow)}
  .top-left{display:flex;align-items:center;gap:12px}
  .mini-shield{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;background:linear-gradient(145deg,#2f6bff,#7b5bff);
    box-shadow:0 6px 16px rgba(47,107,255,.3);flex-shrink:0}
  .mini-shield svg{width:21px;height:21px}
  .top h2{font-size:16px;font-weight:800;letter-spacing:.3px}
  .who{color:var(--muted);font-size:11px;margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:24px}
  .stat{background:var(--white);border:1px solid var(--line2);padding:16px 14px;border-radius:18px;box-shadow:var(--shadow)}
  .stat .num{font-size:24px;font-weight:900;color:var(--accent)}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
  .section-title{font-size:14px;margin:26px 0 14px;display:flex;justify-content:space-between;
    align-items:center;gap:10px;flex-wrap:wrap;font-weight:800}
  .section-title span{display:flex;align-items:center;gap:8px}
  .section-title span::before{content:"";width:4px;height:16px;border-radius:4px;
    background:linear-gradient(180deg,#2f6bff,#7b5bff)}
  .user-card{background:var(--white);border:1px solid var(--line2);border-radius:18px;
    padding:16px 17px;margin-bottom:12px;display:flex;justify-content:space-between;
    align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow);transition:.2s;animation:rise .35s ease}
  .user-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .user-info{flex:1;min-width:170px}
  .user-info .name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .user-info .meta{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.7}
  .key-inline{font-family:ui-monospace,monospace;font-size:11px;color:var(--accent);
    background:var(--accent-soft);padding:2px 7px;border-radius:6px}
  .user-actions{display:flex;gap:7px;flex-wrap:wrap}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.4px}
  .badge.ok{background:var(--green-soft);color:var(--green)}
  .badge.low{background:var(--red-soft);color:var(--red)}
  .badge.warn{background:var(--orange-soft);color:var(--orange)}
  .tariff-chip{display:inline-block;padding:2px 9px;border-radius:8px;font-size:10px;
    font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .t-Lite{background:var(--accent-soft);color:var(--accent)}
  .t-Standard{background:var(--purple-soft);color:var(--purple)}
  .t-Pro{background:var(--orange-soft);color:var(--orange)}
  .t-Unlimited{background:var(--green-soft);color:var(--green)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:36px 22px;
    background:var(--white);border:1.5px dashed var(--line);border-radius:18px;line-height:1.8}
  .key-box{background:var(--bg);border:1.5px dashed #c8d4f0;border-radius:13px;padding:13px;
    font-size:12px;color:var(--accent);word-break:break-all;margin-top:9px;
    font-family:ui-monospace,monospace;letter-spacing:.5px;text-align:center;font-weight:700}
  .progress{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}
  .progress > div{height:100%;border-radius:8px;background:linear-gradient(90deg,#12b356,#2f6bff);transition:width .5s ease}
  .notice{display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border-radius:16px;
    margin-bottom:16px;font-size:13px;line-height:1.6;animation:rise .4s ease;border:1.5px solid}
  .notice .ico{font-size:20px;flex-shrink:0;line-height:1.2}
  .notice b{display:block;font-size:14px;margin-bottom:2px}
  .notice.warn{background:var(--orange-soft);border-color:#ffd99a;color:#8a5a00}
  .notice.danger{background:var(--red-soft);border-color:#ffc2cf;color:#a00f30}
  .notice.info{background:var(--accent-soft);border-color:#c9d8ff;color:#1c47a8}
  .attention{background:var(--orange-soft);border:1.5px solid #ffd99a;border-radius:18px;
    padding:14px 16px;margin-bottom:18px}
  .attention h4{font-size:13px;font-weight:800;color:#8a5a00;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .att-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:8px 0;border-top:1px solid #ffe4b8;font-size:12px;flex-wrap:wrap}
  .att-item:first-of-type{border-top:none}
  .att-item .nm{font-weight:700;color:var(--text)}
  .att-item .st{color:#a06a00;font-size:11px;font-weight:600}
  .att-item .st.red{color:var(--red)}
  .overlay{display:none;position:fixed;inset:0;background:rgba(20,26,46,.45);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;
    align-items:flex-end;justify-content:center;padding:0}
  .overlay.show{display:flex}
  @media(min-width:600px){.overlay{align-items:center;padding:20px}}
  .modal{background:var(--white);border-radius:26px 26px 0 0;padding:26px 22px 32px;
    width:100%;max-width:470px;animation:up .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 60px rgba(20,26,46,.25)}
  @media(min-width:600px){.modal{border-radius:26px}}
  @keyframes up{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h3{font-size:19px;margin-bottom:4px;font-weight:800}
  .modal .sub{color:var(--muted);font-size:12px;margin-bottom:20px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:10px;margin-top:24px}
  .modal-actions button{flex:1}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(140px);
    background:#141a2e;color:#fff;padding:13px 24px;border-radius:14px;font-size:13px;font-weight:700;
    z-index:200;transition:.35s cubic-bezier(.2,.8,.2,1);white-space:nowrap;box-shadow:0 12px 34px rgba(20,26,46,.35)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.warn{background:var(--orange);color:#fff}
  .toast.danger{background:var(--red);color:#fff}
  .toast.ok{background:var(--green);color:#fff}
  .info-box{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;
    padding:16px;font-size:12px;line-height:1.9;color:var(--muted);margin-top:18px}
  .info-box b{color:var(--text)}
  .connect-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px 20px 18px}
  .connect-btn{
    width:140px;height:140px;border-radius:50%;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#eef2ff,#dce6ff);
    box-shadow:0 10px 40px rgba(47,107,255,.2), inset 0 2px 10px rgba(255,255,255,.8);
    transition:.3s;position:relative}
  .connect-btn svg{width:56px;height:56px;stroke:var(--accent);transition:.3s}
  .connect-btn:active{transform:scale(.95)}
  .connect-btn.connecting{
    background:linear-gradient(145deg,#2f6bff,#5b8cff);
    box-shadow:0 10px 50px rgba(47,107,255,.5);
    animation:pulseConnect 1.2s ease-in-out infinite}
  .connect-btn.connecting svg{stroke:#fff}
  @keyframes pulseConnect{
    0%,100%{transform:scale(1);box-shadow:0 10px 50px rgba(47,107,255,.5)}
    50%{transform:scale(1.05);box-shadow:0 10px 70px rgba(47,107,255,.7)}}
  .connect-btn.connected{
    background:linear-gradient(145deg,#12b356,#0fa04d);
    box-shadow:0 10px 50px rgba(18,179,86,.45)}
  .connect-btn.connected svg{stroke:#fff}
  .connect-btn .spinner{
    display:none;width:52px;height:52px;border-radius:50%;
    border:4px solid rgba(255,255,255,.3);border-top-color:#fff;
    animation:spin 0.8s linear infinite}
  .connect-btn.connecting .spinner{display:block}
  .connect-btn.connecting svg{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .connect-label{font-size:15px;font-weight:800;color:var(--text);margin-top:18px;
    text-align:center;transition:.3s}
  .connect-label.connecting{color:var(--accent)}
  .connect-label.connected{color:var(--green)}
  .connect-sub{font-size:12px;color:var(--muted);margin-top:4px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= ВХОД ================= -->
<div id="loginScreen">
  <div class="logo-shield">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>
  </div>
  <div class="brand">XQEVON</div>
  <div class="brand-sub">VPN Panel</div>

  <div class="login-card">
    <div class="tabs">
      <button id="tabOwner" class="active" onclick="switchTab('owner')">Владелец</button>
      <button id="tabUser" onclick="switchTab('user')">Друг</button>
    </div>

    <div id="ownerForm">
      <label>Email владельца</label>
      <input id="ownerEmail" type="email" placeholder="you@example.com" autocomplete="off">
      <label>Пароль владельца</label>
      <input id="ownerPass" type="password" placeholder="••••••••" autocomplete="off">
      <button class="btn-primary" onclick="ownerLogin()">Войти как владелец</button>
    </div>

    <div id="userForm" style="display:none">
      <label>Ключ доступа</label>
      <input id="userKey" placeholder="XQEV-XXXX-XXXX-XXXX-XXXX" autocomplete="off">
      <button class="btn-primary" onclick="userLogin()">Войти по ключу</button>
    </div>

    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ================= ПАНЕЛЬ ================= -->
<div id="panel">
  <div class="top">
    <div class="top-left">
      <div class="mini-shield">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div>
        <h2>XQEVON VPN</h2>
        <div class="who" id="whoLabel"></div>
      </div>
    </div>
    <button class="btn-ghost btn-sm" onclick="logout()">Выйти</button>
  </div>

  <!-- Панель владельца -->
  <div id="ownerPanel">
    <div class="stats">
      <div class="stat"><div class="num" id="statUsers">0</div><div class="lbl">Пользователей</div></div>
      <div class="stat"><div class="num" id="statDevices">0</div><div class="lbl">Устройств</div></div>
      <div class="stat"><div class="num" id="statGb">0</div><div class="lbl">ГБ выдано</div></div>
    </div>
    <div id="attentionBlock"></div>
    <div class="section-title">
      <span>Пользователи и тарифы</span>
      <button class="btn-green btn-sm" onclick="openCreate()">+ Создать</button>
    </div>
    <div id="usersList"></div>
  </div>

  <!-- Кабинет друга -->
  <div id="userPanel" style="display:none">
    <div id="userCabinet"></div>
  </div>
</div>

<!-- ================= МОДАЛКА ================= -->
<div class="overlay" id="createOverlay">
  <div class="modal">
    <h3>Новый пользователь</h3>
    <div class="sub">Выдайте другу тариф с лимитами</div>
    <label>Имя</label>
    <input id="newName" placeholder="Например: Иван">
    <label>Название тарифа</label>
    <select id="newTariff">
      <option value="Lite">Lite — 10 ГБ, 1 устройство</option>
      <option value="Standard" selected>Standard — 50 ГБ, 2 устройства</option>
      <option value="Pro">Pro — 200 ГБ, 3 устройства</option>
      <option value="Unlimited">Unlimited — без лимита, 5 устройств</option>
    </select>
    <div class="row2">
      <div><label>Лимит ГБ</label><input id="newGb" type="number" value="50" min="1"></div>
      <div><label>Устройств</label><input id="newDevices" type="number" value="2" min="1"></div>
    </div>
    <label>Срок (дней)</label>
    <input id="newDays" type="number" value="30" min="1">
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeCreate()">Отмена</button>
      <button class="btn-green" onclick="createUser()">Создать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</div>
<script>
const OWNER_EMAIL = "yaroslavdruzyaka@yandex.ru";
const OWNER_PASS  = "pokotylo";

const DB = {
  get users(){ try{ return JSON.parse(localStorage.getItem('xq_users') || '[]') }catch(e){ return [] } },
  set users(v){ localStorage.setItem('xq_users', JSON.stringify(v)) }
};
let current = { role:null, key:null };
let vpnState = { status:'disconnected', timer:null };

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 3200);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function randKey(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = 'XQEV-';
  for(let i=0;i<16;i++){ s += chars[Math.floor(Math.random()*chars.length)]; if(i%4===3 && i<15) s += '-'; }
  return s;
}
function daysLeft(expire){ return Math.ceil((expire - Date.now())/86400000); }

function expiryText(d){
  if(d <= 0) return { level:'danger', title:'Подписка истекла', msg:'Срок действия закончился. Обратитесь к владельцу.', ico:'⛔' };
  if(d === 1) return { level:'danger', title:'Подписка истекает завтра', msg:'Остался 1 день. Продлите подписку.', ico:'🚨' };
  if(d <= 3) return { level:'warn', title:'Подписка истекает через '+d+' дня', msg:'Осталось '+d+' дн.', ico:'⚠️' };
  if(d <= 7) return { level:'warn', title:'Подписка истекает через '+d+' дней', msg:'Осталось '+d+' дн.', ico:'⏳' };
  return null;
}

function pushBrowserNotice(title, body){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'granted'){
    try{ new Notification('XQEVON VPN', { body: title + '. ' + body }); }catch(e){}
  } else if(Notification.permission !== 'denied'){
    Notification.requestPermission().then(p => {
      if(p === 'granted'){ try{ new Notification('XQEVON VPN', { body: title + '. ' + body }); }catch(e){} }
    });
  }
}

function switchTab(t){
  document.getElementById('tabOwner').classList.toggle('active', t==='owner');
  document.getElementById('tabUser').classList.toggle('active', t==='user');
  document.getElementById('ownerForm').style.display = t==='owner' ? 'block' : 'none';
  document.getElementById('userForm').style.display = t==='user' ? 'block' : 'none';
  document.getElementById('loginErr').textContent = '';
}

function ownerLogin(){
  const err = document.getElementById('loginErr');
  const email = document.getElementById('ownerEmail').value.trim().toLowerCase();
  const pass = document.getElementById('ownerPass').value;
  if(email !== OWNER_EMAIL || pass !== OWNER_PASS){
    err.textContent = 'Неверный email или пароль владельца';
    return;
  }
  current = { role:'owner', key:null };
  showPanel();
}

function userLogin(){
  const key = document.getElementById('userKey').value.trim().toUpperCase();
  const err = document.getElementById('loginErr');
  if(!key){ err.textContent = 'Введите ключ'; return; }
  const user = DB.users.find(u => u.key === key);
  if(!user){ err.textContent = 'Ключ не найден. Проверьте правильность.'; return; }
  if(daysLeft(user.expire) <= 0){ err.textContent = 'Подписка истекла. Обратитесь к владельцу.'; return; }
  current = { role:'user', key };
  showPanel();
}

function logout(){
  current = { role:null, key:null };
  if(vpnState.timer){ clearTimeout(vpnState.timer); vpnState.timer = null; }
  vpnState.status = 'disconnected';
  document.getElementById('panel').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('userKey').value = '';
  document.getElementById('ownerPass').value = '';
}

function showPanel(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  if(current.role === 'owner'){
    document.getElementById('whoLabel').textContent = 'Владелец: ' + OWNER_EMAIL;
    document.getElementById('ownerPanel').style.display = 'block';
    document.getElementById('userPanel').style.display = 'none';
    renderOwner();
  } else {
    document.getElementById('whoLabel').textContent = 'Кабинет друга';
    document.getElementById('ownerPanel').style.display = 'none';
    document.getElementById('userPanel').style.display = 'block';
    renderUser();
  }
}

function renderOwner(){
  const users = DB.users;
  document.getElementById('statUsers').textContent = users.length;
  document.getElementById('statDevices').textContent = users.reduce((s,u)=>s+u.devices,0);
  document.getElementById('statGb').textContent = users.reduce((s,u)=>s+(u.gb===0?0:u.gb),0);

  const attention = users.filter(u => daysLeft(u.expire) <= 7);
  const attBox = document.getElementById('attentionBlock');
  if(attention.length){
    attBox.innerHTML = '<div class="attention"><h4>⚠️ Требуют внимания ('+attention.length+')</h4>' +
      attention.map(u => {
        const d = daysLeft(u.expire);
        return '<div class="att-item"><div class="nm">'+esc(u.name)+' <span class="tariff-chip t-'+esc(u.tariff)+'" style="font-size:9px">'+esc(u.tariff)+'</span></div>' +
          '<div class="st '+(d<=0?'red':'')+'">'+(d<=0 ? 'подписка истекла' : 'истекает через '+d+' дн.')+'</div></div>';
      }).join('') + '</div>';
  } else { attBox.innerHTML = ''; }

  const list = document.getElementById('usersList');
  if(!users.length){
    list.innerHTML = '<div class="empty">Пока нет пользователей.<br>Нажмите «+ Создать», чтобы выдать первый тариф.</div>';
    return;
  }
  list.innerHTML = users.map(u => {
    const d = daysLeft(u.expire);
    let badge;
    if(d <= 0) badge = '<span class="badge low">ИСТЁК</span>';
    else if(d <= 3) badge = '<span class="badge low">'+d+' дн.</span>';
    else if(d <= 7) badge = '<span class="badge warn">'+d+' дн.</span>';
    else badge = '<span class="badge ok">'+d+' дн.</span>';
    return '<div class="user-card"><div class="user-info">' +
      '<div class="name">'+esc(u.name)+' '+badge+'</div>' +
      '<div class="meta"><span class="tariff-chip t-'+esc(u.tariff)+'">'+esc(u.tariff)+'</span> ' +
      (u.gb===0?'∞':u.gb)+' ГБ · '+u.devices+' устр.<br><span class="key-inline">'+esc(u.key)+'</span></div></div>' +
      '<div class="user-actions">' +
      '<button class="btn-ghost btn-sm" onclick="copyKey(\''+u.key+'\')">Копировать</button>' +
      '<button class="btn-danger btn-sm" onclick="delUser(\''+u.key+'\')">Удалить</button>' +
      '</div></div>';
  }).join('');
}

function openCreate(){ document.getElementById('createOverlay').classList.add('show'); }
function closeCreate(){ document.getElementById('createOverlay').classList.remove('show'); }

document.getElementById('newTariff').addEventListener('change', function(){
  const map = { Lite:{gb:10,devices:1}, Standard:{gb:50,devices:2}, Pro:{gb:200,devices:3}, Unlimited:{gb:0,devices:5} };
  const v = map[this.value];
  document.getElementById('newGb').value = v.gb;
  document.getElementById('newDevices').value = v.devices;
});

function createUser(){
  const name = document.getElementById('newName').value.trim();
  const tariff = document.getElementById('newTariff').value;
  const gb = parseInt(document.getElementById('newGb').value) || 0;
  const devices = parseInt(document.getElementById('newDevices').value) || 1;
  const days = parseInt(document.getElementById('newDays').value) || 30;
  if(!name){ toast('Введите имя', 'warn'); return; }
  const users = DB.users;
  users.push({ name, tariff, gb, devices, key: randKey(), created: Date.now(), expire: Date.now() + days * 86400000 });
  DB.users = users;
  closeCreate();
  document.getElementById('newName').value = '';
  renderOwner();
  toast('Пользователь создан', 'ok');
}

function delUser(key){
  if(!confirm('Удалить пользователя?')) return;
  DB.users = DB.users.filter(u => u.key !== key);
  renderOwner();
  toast('Удалено');
}

function copyKey(key){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(key).then(
      ()=>toast('Ключ скопирован', 'ok'),
      ()=>fallbackCopy(key)
    );
  } else { fallbackCopy(key); }
}
function fallbackCopy(key){
  const ta = document.createElement('textarea');
  ta.value = key; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Ключ скопирован', 'ok'); }
  catch(e){ toast('Не удалось скопировать', 'warn'); }
  document.body.removeChild(ta);
}
  function renderUser(){
  const u = DB.users.find(x => x.key === current.key);
  const box = document.getElementById('userCabinet');
  if(!u){ box.innerHTML = '<div class="empty">Пользователь не найден</div>'; return; }
  const d = daysLeft(u.expire);
  const totalDays = Math.max(1, Math.ceil((u.expire - u.created)/86400000));
  const pct = Math.max(0, Math.min(100, Math.round((d/totalDays)*100)));
  const nt = expiryText(d);
  let noticeHtml = '';
  if(nt){
    noticeHtml = '<div class="notice '+nt.level+'"><div class="ico">'+nt.ico+'</div><div><b>'+esc(nt.title)+'</b>'+esc(nt.msg)+'</div></div>';
    pushBrowserNotice(nt.title, nt.msg);
  }
  box.innerHTML = noticeHtml +
    '<div class="connect-wrap">' +
      '<button class="connect-btn" id="connectBtn" onclick="toggleVpn()">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' +
        '</svg>' +
        '<div class="spinner"></div>' +
      '</button>' +
      '<div class="connect-label" id="connectLabel">Нажмите, чтобы подключиться</div>' +
      '<div class="connect-sub" id="connectSub">VPN не активен</div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="num">'+(u.gb===0?'∞':u.gb)+'</div><div class="lbl">ГБ в тарифе</div></div>' +
      '<div class="stat"><div class="num">'+u.devices+'</div><div class="lbl">Устройств</div></div>' +
      '<div class="stat"><div class="num">'+(d>0?d:0)+'</div><div class="lbl">Дней осталось</div></div>' +
    '</div>' +
    '<div class="user-card" style="flex-direction:column;align-items:stretch;gap:14px">' +
      '<div class="user-info">' +
        '<div class="name">'+esc(u.name)+' <span class="tariff-chip t-'+esc(u.tariff)+'">'+esc(u.tariff)+'</span></div>' +
        '<div class="meta">Тариф активен · осталось '+(d>0?d:0)+' дн.</div>' +
        '<div class="progress"><div style="width:'+pct+'%"></div></div>' +
      '</div>' +
      '<div>' +
        '<div style="font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;font-weight:700">Ваш ключ подключения</div>' +
        '<div class="key-box">'+esc(u.key)+'</div>' +
        '<button class="btn-primary" style="margin-top:14px" onclick="copyKey(\''+u.key+'\')">Копировать ключ</button>' +
      '</div>' +
    '</div>' +
    '<div class="info-box">' +
      '<b>Как подключиться:</b><br>' +
      '1. Нажмите большую кнопку выше.<br>' +
      '2. Дождитесь анимации подключения.<br>' +
      '3. Когда появится галочка — VPN активен.<br>' +
      '<span style="color:var(--muted)">Демо-режим. Реальный туннель заработает после подключения сервера.</span>' +
    '</div>';
  vpnState.status = 'disconnected';
}

function toggleVpn(){
  const btn = document.getElementById('connectBtn');
  const label = document.getElementById('connectLabel');
  const sub = document.getElementById('connectSub');
  if(!btn) return;

  if(vpnState.status === 'disconnected'){
    vpnState.status = 'connecting';
    btn.className = 'connect-btn connecting';
    label.className = 'connect-label connecting';
    label.textContent = 'Подключение...';
    sub.textContent = 'Устанавливаем защищённое соединение';

    vpnState.timer = setTimeout(() => {
      vpnState.status = 'connected';
      btn.className = 'connect-btn connected';
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
      label.className = 'connect-label connected';
      label.textContent = 'Подключено';
      sub.textContent = 'Ваше соединение защищено';
      toast('VPN подключён', 'ok');
    }, 2200);
  } else if(vpnState.status === 'connected'){
    vpnState.status = 'disconnected';
    if(vpnState.timer){ clearTimeout(vpnState.timer); vpnState.timer = null; }
    btn.className = 'connect-btn';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><div class="spinner"></div>';
    label.className = 'connect-label';
    label.textContent = 'Нажмите, чтобы подключиться';
    sub.textContent = 'VPN не активен';
    toast('VPN отключён', 'warn');
  }
}
</script>
